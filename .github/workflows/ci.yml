# CI: build + tests + clean-install smoke on every push/PR to main.
#
# The clean-install smoke exists because of a shipped crash: express lives in
# devDependencies (and as an optional peer), so every dev environment had it
# while a bare `npm install @agentadmit/sdk; require('@agentadmit/sdk')`
# crashed with MODULE_NOT_FOUND through 1.5.0. Installing the packed tarball
# into an EMPTY project and requiring is the only check that catches that
# class of bug. Action versions pinned to exact SHAs per supply chain policy.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Smoke test built entry point
        run: npm run smoke

      - name: Run tests
        run: npm test

      - name: Clean-install smoke test (no peer deps)
        run: |
          npm pack
          mkdir /tmp/smoke && cd /tmp/smoke && npm init -y
          npm install --ignore-scripts "$GITHUB_WORKSPACE"/agentadmit-sdk-*.tgz
          node -e "const s=require('@agentadmit/sdk'); if (typeof s.validateAgentToken!=='function'||typeof s.callerConsent!=='function') throw new Error('missing exports'); console.log('clean require OK')"
