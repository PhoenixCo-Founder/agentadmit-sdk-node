# Publish @agentadmit/sdk to npm with Trusted Publishing + Provenance
#
# Trusted Publishing (OIDC) eliminates long-lived npm tokens.
# Provenance is generated automatically with trusted publishing.
#
# Prerequisites (one-time setup on npmjs.com):
#   1. Create npm org: @agentadmit
#   2. Create package: @agentadmit/sdk
#   3. Configure trusted publisher:
#      - Organization: PhoenixCo-Founder
#      - Repository: agentadmit-sdk-node
#      - Workflow: publish.yml
#   4. Restrict token access: "Require 2FA and disallow tokens"
#
# Trigger: push a version tag (e.g., git tag v1.0.0 && git push --tags)
# Action versions are pinned to exact SHAs per supply chain policy.

name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Check tag matches package version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      # Install npm 11+ for trusted publishing support
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Smoke test built entry point
        run: npm run smoke

      - name: Run tests
        run: npm test --if-present

      # The dev environment always has express (devDependencies), which masked
      # a shipped crash: through 1.5.0 a bare `npm install @agentadmit/sdk`
      # crashed on require because routes.ts imported express at top level while
      # express is only an optional peer. Installing the packed tarball into an
      # EMPTY project (no express) and requiring is the only check that catches
      # that class of bug.
      - name: Clean-install smoke test (no peer deps)
        run: |
          npm pack
          mkdir /tmp/smoke && cd /tmp/smoke && npm init -y
          npm install --ignore-scripts "$GITHUB_WORKSPACE"/agentadmit-sdk-*.tgz
          node -e "const s=require('@agentadmit/sdk'); if (typeof s.validateAgentToken!=='function'||typeof s.callerConsent!=='function') throw new Error('missing exports'); console.log('clean require OK')"

      - name: Publish with trusted publishing
        run: npm publish --access public
